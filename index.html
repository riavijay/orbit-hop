<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit Hop</title>
<style>*,*::before,*::after{box-sizing:border-box} body{margin:0} img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #0E0B1F;
    --mist: #1C1740;
    --line: #3A3270;
    --text: #F4EEFF;
    --dim: #A79FD0;
    --peach: #FFB38A;
    --gold: #FFD166;
    --display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; background: var(--ink); color: var(--text); }
  body { overflow: hidden; font-family: var(--mono); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  #stage { position: relative; height: 100%; width: 100%; touch-action: manipulation; cursor: pointer; }
  canvas { display: block; width: 100%; height: 100%; }

  .hud { position: absolute; inset: 0 0 auto 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 16px 20px; pointer-events: none; gap: 12px; }
  .score { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 9vw, 64px); line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .score small { display: block; font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); margin-top: 6px; }
  .right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .best { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); font-variant-numeric: tabular-nums; }
  .best b { color: var(--gold); font-weight: 500; }
  .mute { pointer-events: auto; background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; font: 500 11px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; padding: 8px 12px; cursor: pointer; }
  .mute:hover { color: var(--text); border-color: var(--dim); }
  .mute:focus-visible, .go:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .panel { position: absolute; left: 50%; bottom: max(8vh, 32px); transform: translateX(-50%); width: min(420px, calc(100% - 32px)); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; pointer-events: none; box-sizing: border-box; padding: 28px 24px 24px; background: rgba(14, 11, 31, 0.82); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(167, 159, 208, 0.22); border-radius: 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45); }
  .panel h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(44px, 12vw, 76px); line-height: 0.92; letter-spacing: -0.03em; text-wrap: balance; }
  .panel h1 span { color: var(--peach); }
  .panel h2 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--peach); }
  .big { font-family: var(--display); font-weight: 800; font-size: 88px; line-height: 1; font-variant-numeric: tabular-nums; }
  .panel p { margin: 0; color: var(--dim); font-size: 13px; line-height: 1.6; max-width: 34ch; }
  .panel p kbd { font: inherit; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
  .go { pointer-events: auto; margin-top: 4px; background: var(--gold); color: var(--ink); border: 0; border-radius: 999px; font: 800 14px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; padding: 16px 28px; cursor: pointer; box-shadow: 0 0 0 6px rgba(255, 209, 102, 0.14); }
  .go:hover { background: #FFDD85; }
  .newbest { color: var(--gold); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; }
  .rank { color: var(--text); font-size: 13px; }
  .easy { pointer-events: auto; display: inline-flex; align-items: center; gap: 10px; background: transparent; border: 0; padding: 6px 4px; color: var(--dim); font: 500 12px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; }
  .easy:hover { color: var(--text); }
  .easy:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
  .easy .track { position: relative; width: 36px; height: 20px; border-radius: 999px; background: var(--line); transition: background .2s; flex: none; }
  .easy .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--dim); transition: transform .2s, background .2s; }
  .easy[aria-checked="true"] { color: var(--text); }
  .easy[aria-checked="true"] .track { background: rgba(127, 209, 185, 0.35); }
  .easy[aria-checked="true"] .track::after { transform: translateX(16px); background: #7FD1B9; }
  .easy small { font-size: 11px; letter-spacing: 0.04em; text-transform: none; color: var(--dim); }
  .tag { color: #7FD1B9; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
  @media (prefers-reduced-motion: no-preference) {
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.45; } }
  }
</style>

</head>
<body>
<div id="stage">
  <canvas id="c" aria-label="Orbit Hop game"></canvas>
  <div class="hud">
    <div class="score" id="score" hidden>0<small>planets hopped</small></div>
    <div></div>
    <div class="right">
      <div class="best"><span id="bestLabel">Best</span> <b id="best">0</b></div>
      <button class="mute" id="mute" type="button" aria-pressed="false">Sound on</button>
    </div>
  </div>

  <div class="panel" id="title">
    <h1>Orbit<br><span>Hop</span></h1>
    <p>You're a tiny comet. Tap to break orbit and fly straight — get close to another planet and its gravity catches you. Keep climbing.</p>
    <button class="go" id="start" type="button">Launch</button>
    <button class="easy" type="button" role="switch" aria-checked="false"><span class="track"></span>Easy mode <small>· aim line stays on</small></button>
    <p class="pulse">Tap, click, or press <kbd>Space</kbd></p>
  </div>

  <div class="panel" id="over" hidden>
    <h2 id="overMsg">Lost in the void</h2>
    <div class="big" id="final">0</div>
    <div class="newbest" id="newbest" hidden>New best</div>
    <div class="rank" id="rank"></div>
    <div class="tag" id="easyTag" hidden>Easy mode run</div>
    <button class="go" id="again" type="button">Fly again</button>
    <button class="easy" type="button" role="switch" aria-checked="false"><span class="track"></span>Easy mode <small>· aim line stays on</small></button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), bestEl = $('best'), titleEl = $('title'), overEl = $('over');

  const PLANET_COLORS = [
    ['#7FD1B9', '#2F7F6B'], ['#F28DB2', '#9A3B63'], ['#9AA7FF', '#4450A8'],
    ['#FFD166', '#B77F12'], ['#FFB38A', '#B2552A'], ['#C9A7FF', '#6A43B0']
  ];
  const RANKS = [
    [0, 'Space debris'], [3, 'Stray pebble'], [8, 'Wandering comet'],
    [15, 'Gravity surfer'], [25, 'Slingshot artist'], [40, 'Orbital legend'], [60, 'Keeper of the cosmos']
  ];
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, DPR = 1, colW = 0, ox = 0;
  let easy = false;
  try { easy = localStorage.getItem('orbitHopEasy') === '1'; } catch (e) {}
  const bestKey = () => easy ? 'orbitHopBestEasy' : 'orbitHopBest';
  let best = 0;
  function loadBest() {
    best = 0;
    try { best = +localStorage.getItem(bestKey()) || 0; } catch (e) {}
    bestEl.textContent = best;
    $('bestLabel').textContent = easy ? 'Easy best' : 'Best';
  }
  const easyBtns = document.querySelectorAll('.easy');
  function syncEasy() { easyBtns.forEach(b => b.setAttribute('aria-checked', String(easy))); loadBest(); }
  easyBtns.forEach(b => b.addEventListener('click', e => {
    e.stopPropagation(); b.blur(); easy = !easy; syncEasy();
    try { localStorage.setItem('orbitHopEasy', easy ? '1' : '0'); } catch (err) {}
  }));
  syncEasy();

  // ---- audio ----
  let actx = null, muted = false;
  try { muted = localStorage.getItem('orbitHopMuted') === '1'; } catch (e) {}
  const muteBtn = $('mute');
  function syncMute() { muteBtn.textContent = muted ? 'Sound off' : 'Sound on'; muteBtn.setAttribute('aria-pressed', String(muted)); }
  syncMute();
  muteBtn.addEventListener('click', e => {
    e.stopPropagation(); muteBtn.blur(); muted = !muted; syncMute();
    try { localStorage.setItem('orbitHopMuted', muted ? '1' : '0'); } catch (err) {}
  });
  function tone(freq, dur, type = 'sine', vol = 0.12, slide = 0) {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  const PENTA = [0, 2, 4, 7, 9];
  function captureSound(n) {
    const step = PENTA[n % 5] + 12 * Math.floor((n % 15) / 5);
    const f = 330 * Math.pow(2, step / 12);
    tone(f, 0.28, 'triangle', 0.14); setTimeout(() => tone(f * 1.5, 0.22, 'sine', 0.06), 60);
  }

  // ---- world ----
  let stars = [], planets = [], parts = [], trail = [];
  let state = 'title'; // title | play | over
  let score = 0, camY = 0, camTarget = 0, shake = 0, time = 0;
  const P = { x: 0, y: 0, vx: 0, vy: 0, planet: null, ang: 0, dir: 1, flying: false, flyT: 0, from: null };

  function resize() {
    const r = cv.getBoundingClientRect();
    W = r.width; H = r.height; DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * DPR; cv.height = H * DPR;
    colW = Math.min(W, 480); ox = (W - colW) / 2;
    stars = [];
    const n = Math.round(W * H / 2600);
    for (let i = 0; i < n; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, z: Math.random(), tw: Math.random() * 6.28 });
  }

  function makePlanet(y, level) {
    const r = 14 + Math.random() * 14;
    const orbitR = r + 20 + Math.random() * 10;
    const margin = orbitR + 12;
    const x = ox + margin + Math.random() * (colW - margin * 2);
    const moving = level > 6 && Math.random() < Math.min(0.6, (level - 6) * 0.05);
    return {
      x, y, bx: x, r, orbitR,
      dir: Math.random() < 0.5 ? 1 : -1,
      spin: 2.1 + Math.min(1.8, level * 0.05) + Math.random() * 0.5,
      col: PLANET_COLORS[Math.floor(Math.random() * PLANET_COLORS.length)],
      ring: Math.random() < 0.3,
      moving, amp: moving ? Math.min(colW / 2 - margin, 40 + level * 2) : 0,
      phase: Math.random() * 6.28, mspeed: 0.6 + Math.random() * 0.6,
      visited: false, id: Math.random()
    };
  }

  function topPlanetY() { return planets.reduce((m, p) => Math.min(m, p.y), Infinity); }
  function fillPlanets() {
    while (planets.length < 10) {
      const lvl = score + planets.length;
      const gap = 150 + Math.random() * 70 + Math.min(40, score * 1.2);
      planets.push(makePlanet(topPlanetY() - gap, lvl));
    }
  }

  function reset() {
    planets = []; parts = []; trail = [];
    score = 0; scoreEl.firstChild.nodeValue = '0';
    const first = makePlanet(H * 0.72, 0);
    first.x = first.bx = ox + colW / 2; first.visited = true; first.moving = false;
    planets.push(first); fillPlanets();
    attach(first, -Math.PI / 2, 1);
    camY = camTarget = 0;
  }

  function attach(p, ang, dir) {
    P.planet = p; P.ang = ang; P.dir = dir; P.flying = false;
    P.x = p.x + Math.cos(ang) * p.orbitR; P.y = p.y + Math.sin(ang) * p.orbitR;
  }

  function launch() {
    if (!P.planet || P.flying) return;
    const sp = 360 + Math.min(120, score * 3);
    const tx = -Math.sin(P.ang) * P.dir, ty = Math.cos(P.ang) * P.dir;
    P.vx = tx * sp; P.vy = ty * sp; P.flying = true; P.flyT = 0; P.from = P.planet; P.planet = null;
    tone(520, 0.12, 'sine', 0.08, -260);
    burst(P.x, P.y, '#FFF4E0', 6, 60);
  }

  function burst(x, y, color, n, spd) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, s = spd * (0.3 + Math.random());
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color, size: 1 + Math.random() * 2 });
    }
  }

  function die(msg) {
    if (state !== 'play') return;
    state = 'over'; shake = 10;
    burst(P.x, P.y, '#FFB38A', 30, 160); burst(P.x, P.y, '#FFF4E0', 14, 90);
    tone(200, 0.5, 'sawtooth', 0.07, -150);
    const isBest = score > best;
    if (isBest) { best = score; bestEl.textContent = best; try { localStorage.setItem(bestKey(), String(best)); } catch (e) {} }
    $('overMsg').textContent = msg;
    $('final').textContent = score;
    $('newbest').hidden = !(isBest && score > 0);
    let rank = RANKS[0][1];
    for (const [min, name] of RANKS) if (score >= min) rank = name;
    $('rank').textContent = 'Rank: ' + rank;
    $('easyTag').hidden = !easy;
    setTimeout(() => { overEl.hidden = false; $('again').focus({ preventScroll: true }); }, 450);
  }

  function start() {
    reset(); state = 'play';
    titleEl.hidden = true; overEl.hidden = true; scoreEl.hidden = false;
    tone(440, 0.15, 'triangle', 0.08);
  }

  function press() {
    if (state === 'play') launch();
    else if (state === 'title') start();
    else if (state === 'over' && !overEl.hidden) start();
  }

  // ---- update ----
  function update(dt) {
    time += dt;
    for (const p of planets) {
      if (p.moving) { p.phase += dt * p.mspeed; p.x = p.bx + Math.sin(p.phase) * p.amp; }
    }

    if (state === 'play' || state === 'title') {
      if (P.planet) {
        const p = P.planet;
        P.ang += P.dir * p.spin * dt;
        P.x = p.x + Math.cos(P.ang) * p.orbitR; P.y = p.y + Math.sin(P.ang) * p.orbitR;
        camTarget = p.y - H * 0.68;
      } else if (P.flying && state === 'play') {
        P.flyT += dt;
        P.x += P.vx * dt; P.y += P.vy * dt;
        for (const p of planets) {
          if (p === P.from && P.flyT < 0.3) continue;
          const dx = P.x - p.x, dy = P.y - p.y, d = Math.hypot(dx, dy);
          if (d < p.r + 3) { die('Crashed into a planet'); return; }
          if (d < p.orbitR + 4) {
            const cross = dx * P.vy - dy * P.vx;
            attach(p, Math.atan2(dy, dx), cross >= 0 ? 1 : -1);
            if (!p.visited) {
              p.visited = true; score++;
              scoreEl.firstChild.nodeValue = String(score);
              captureSound(score);
              burst(P.x, P.y, p.col[0], 14, 90);
              fillPlanets();
            } else tone(260, 0.1, 'sine', 0.05);
            break;
          }
        }
        if (P.flying) {
          const sy = P.y - camY;
          if (P.x < ox - 8 || P.x > ox + colW + 8) die('Drifted off the map');
          else if (sy > H + 20 || sy < -40 || P.flyT > 2.6) die('Lost in the void');
        }
      }
    }

    camY += (camTarget - camY) * Math.min(1, dt * 3);
    planets = planets.filter(p => p.y - camY < H + 200 || p === P.planet);

    if (P.flying || P.planet) {
      trail.push({ x: P.x, y: P.y, life: 1 });
      if (trail.length > 40) trail.shift();
    }
    for (const t of trail) t.life -= dt * 2.2;
    trail = trail.filter(t => t.life > 0);

    for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.97; q.vy *= 0.97; q.life -= dt * 1.4; }
    parts = parts.filter(q => q.life > 0);
    shake *= 0.88;
  }

  // ---- draw ----
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0B0919'); g.addColorStop(1, '#171238');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      const y = ((s.y - camY * (0.1 + s.z * 0.25)) % H + H) % H;
      const a = 0.25 + s.z * 0.6 + (reduceMotion ? 0 : Math.sin(time * 2 + s.tw) * 0.15);
      ctx.fillStyle = `rgba(244,238,255,${a})`;
      ctx.fillRect(s.x, y, s.z > 0.85 ? 2 : 1, s.z > 0.85 ? 2 : 1);
    }

    if (W > colW + 4) {
      ctx.strokeStyle = 'rgba(167,159,208,0.12)'; ctx.setLineDash([2, 8]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, H); ctx.moveTo(ox + colW, 0); ctx.lineTo(ox + colW, H); ctx.stroke();
      ctx.setLineDash([]);
    }

    const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
    ctx.save(); ctx.translate(sx, sy - camY);

    for (const p of planets) {
      if (p.y - camY < -80 || p.y - camY > H + 80) continue;
      // orbit ring
      ctx.strokeStyle = p === P.planet ? 'rgba(255,241,214,0.35)' : 'rgba(167,159,208,0.18)';
      ctx.setLineDash(p === P.planet ? [] : [3, 6]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.orbitR, 0, 6.283); ctx.stroke(); ctx.setLineDash([]);
      // glow
      const gl = ctx.createRadialGradient(p.x, p.y, p.r * 0.6, p.x, p.y, p.r * 2.4);
      gl.addColorStop(0, p.col[0] + '40'); gl.addColorStop(1, p.col[0] + '00');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2.4, 0, 6.283); ctx.fill();
      // body
      const bg = ctx.createRadialGradient(p.x - p.r * 0.4, p.y - p.r * 0.4, p.r * 0.1, p.x, p.y, p.r);
      bg.addColorStop(0, p.col[0]); bg.addColorStop(1, p.col[1]);
      ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      if (p.ring) {
        ctx.strokeStyle = p.col[0] + 'AA'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * 1.6, p.r * 0.45, -0.35, 0, 6.283); ctx.stroke();
      }
      if (p.visited && p !== P.planet) {
        ctx.fillStyle = 'rgba(14,11,31,0.35)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      }
    }

    // trail
    for (let i = 1; i < trail.length; i++) {
      const a = trail[i - 1], b = trail[i];
      ctx.strokeStyle = `rgba(255,179,138,${b.life * 0.7})`;
      ctx.lineWidth = 4 * b.life; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }

    for (const q of parts) {
      ctx.globalAlpha = Math.max(0, q.life); ctx.fillStyle = q.color;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (state !== 'over') {
      const pg = ctx.createRadialGradient(P.x, P.y, 0, P.x, P.y, 14);
      pg.addColorStop(0, 'rgba(255,244,224,0.9)'); pg.addColorStop(1, 'rgba(255,179,138,0)');
      ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(P.x, P.y, 14, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#FFF4E0'; ctx.beginPath(); ctx.arc(P.x, P.y, 4.5, 0, 6.283); ctx.fill();

      // aim hint: faint tangent line while orbiting
      const hintA = easy ? 0.4 : 0.4 * Math.max(0, 1 - score / 10);
      if (P.planet && state === 'play' && hintA > 0.01) {
        const tx = -Math.sin(P.ang) * P.dir, ty = Math.cos(P.ang) * P.dir;
        ctx.strokeStyle = `rgba(255,209,102,${hintA})`; ctx.setLineDash([2, 6]); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(P.x, P.y); ctx.lineTo(P.x + tx * 140, P.y + ty * 140); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    ctx.restore();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(loop);
  }

  // ---- input ----
  $('stage').addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    e.preventDefault(); press();
  });
  $('start').addEventListener('click', e => { e.stopPropagation(); e.currentTarget.blur(); start(); });
  $('again').addEventListener('click', e => { e.stopPropagation(); e.currentTarget.blur(); start(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
      if (e.target.tagName === 'BUTTON') return;
      e.preventDefault(); press();
    }
  });
  window.addEventListener('resize', () => { const keep = state; resize(); if (keep !== 'play') reset(); });

  resize(); reset();
  requestAnimationFrame(loop);
})();
